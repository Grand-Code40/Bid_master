name: Bid Master panel
on:
  pull_request:
    paths: ['sites-panel/**', '.github/workflows/panel-tests.yml']
  push:
    branches: ['feat/send-inbox-v26']
    paths: ['sites-panel/**', '.github/workflows/panel-tests.yml']
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        generated: ['0', '1']
    defaults:
      run:
        working-directory: sites-panel
    env:
      USE_GENERATED_MIGRATIONS: ${{ matrix.generated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm test
